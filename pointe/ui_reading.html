<!-- Reading mode (reading.py, docs/features/reading-mode.md): Pointe never speaks; every line it would say arrives as
     text, unread until you tap it, talk or type. Served inside ui.html at {{READING}}; the apps have the same button,
     card and words (ReadingCopy in Reading.swift). Each browser keeps its own choice (localStorage `pointe.reading`) and
     dials the call with it (?reading=1); while a call is up the daemon's status is the truth, and a change said by voice
     comes back on the call's socket ({"type": "reading"}) to be kept here. Drive mode holds it (status `held`). -->
<style>
  #readingcard { padding: 0 var(--gutter); } #readingcard:empty { display: none; }
  #readingcard .ask .what { font-weight: 600; }
  #readingcard .ask .need { margin-top: 6px; }
  #talk li.bot.unread, #talk li.bot.read { cursor: pointer; }
  #talk li.bot.unread { border-color: var(--orange-line); }
  #talk li.bot .readmark { display: block; margin-top: 6px; font: 600 11px var(--font); letter-spacing: .06em; text-transform: uppercase; }
  #talk li.bot.unread .readmark { color: var(--accent); }
  #talk li.bot.read .readmark { color: var(--dim); font-weight: 500; }
</style>
<script>
  // The words, word for word reading.COPY and ReadingCopy (tests/test_reading_mode.py).
  const READING_COPY = {
    button: 'Read',
    buttonOn: 'Reading',
    title: 'Reading mode: Pointe writes, you read.',
    body: 'Nothing is spoken. Talk or type as usual. A reply stays unread until you tap it, talk or type.',
    back: 'Talk again',
    unread: 'Unread',
    read: 'Read',
    markRead: 'Mark all read',
    held: 'Drive mode holds reading mode: Pointe talks while you drive.',
    failed: 'Reading mode did not change: the voice is not reachable.',
  };
  const READING_KEY = 'pointe.reading';
  const rdg = {key: ''};
  function readingStored() { try { return localStorage.getItem(READING_KEY) === '1'; } catch (e) { return false; } }
  function readingStore(on) { try { localStorage.setItem(READING_KEY, on ? '1' : '0'); } catch (e) {} }
  const readingQuery = () => readingStored() ? '?reading=1' : '';  // the call's address: the daemon reads it before greeting
  // While a call is up, the call's choice (status); with none, this browser's own.
  function readingNow(s) {
    if (s && s.connected && s.reading) return {on: !!s.reading.on, held: s.reading.held || null};
    return {on: readingStored(), held: null};
  }
  const readingApplies = s => { const r = readingNow(s); return r.on && !r.held; };
  function readingRemote(on) { readingStore(on); refresh(); }  // said by voice on this call: kept for the next one
  async function readingSet(on) {
    readingStore(on);
    if (status && status.connected && status.reading) status.reading.on = on;  // shown at once; the next poll confirms
    readingFollow(status); talkShown = ''; showTalk(status);
    try {
      const r = await fetch('/voice/reading', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({on})});
      if (!r.ok) throw new Error(String(r.status));
    } catch (e) { sayProblem(READING_COPY.failed); }
    refresh();
  }
  function readingToggle() { readingSet(!readingNow(status).on); }
  async function readingMark(through) {  // a tap on a line: it and every line before it; no id: all of them
    try {
      await fetch('/voice/read', {method: 'POST', headers: {'content-type': 'application/json'},
                                  body: JSON.stringify(through === undefined ? {} : {through})});
    } catch (e) {}
    refresh();
  }
  function readingFollow(s) {
    const r = readingNow(s), on = r.on && !r.held;
    document.body.classList.toggle('reading', on);
    const btn = $('readingbtn');
    btn.classList.toggle('on', r.on); btn.setAttribute('aria-pressed', r.on);
    text('reading-label', r.on ? READING_COPY.buttonOn : READING_COPY.button);
    const key = [r.on, r.held || ''].join('|');
    if (key === rdg.key) return;
    rdg.key = key;
    if (!r.on) { $('readingcard').replaceChildren(); return; }
    const card = el('div', 'ask');
    card.setAttribute('role', 'status');
    card.append(el('div', 'what', READING_COPY.title), el('div', 'need', r.held ? READING_COPY.held : READING_COPY.body));
    const row = el('div', 'answer');
    const back = el('button', 'deny', READING_COPY.back); back.id = 'reading-off'; back.onclick = () => readingSet(false);
    row.append(back);
    if (!r.held) {
      const all = el('button', 'deny', READING_COPY.markRead); all.id = 'reading-markread'; all.onclick = () => readingMark();
      row.append(all);
    }
    card.append(row);
    $('readingcard').replaceChildren(card);
  }
  // One of Pointe's lines, in reading mode: Unread or Read under it; a click reads it and every line before it.
  function readingMarkTurn(li, t) {
    li.classList.add(t.unread ? 'unread' : 'read');
    li.append(el('span', 'readmark', t.unread ? READING_COPY.unread : READING_COPY.read));
    li.onclick = () => { if (t.unread) readingMark(t.id); };
  }
</script>
