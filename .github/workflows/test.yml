name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.12.21"  # the version bin/install-uv installs and the e2e images carry
      - run: uv run --locked pytest -q tests/ --ignore=tests/e2e
  # The iPhone app: a simulator build, unsigned, and its unit tests (PointeTests). The UI tests need a test daemon or
  # drive the simulator for minutes; they run locally (ios/e2e/, tests/e2e/ios_app.py).
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: The newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for the simulator and run PointeTests
        working-directory: ios
        run: |
          SIM="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')"
          xcodebuild test -project Pointe.xcodeproj -scheme Pointe -destination "id=$SIM" -only-testing:PointeTests \
            CODE_SIGNING_ALLOWED=NO -quiet
  # docs/security/supply-chain.md. Fails on an unpinned action, a lockfile that drifted from pyproject.toml, a package
  # missing from docs/security/dependencies-allowlist.txt, a URL to a host missing from docs/security/egress-allowlist.txt,
  # an install path that resolves unpinned, a download without a hash, or a known vulnerability in any locked version.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.12.21"
      - name: The lockfile matches pyproject.toml
        run: uv lock --check
      - name: Pins, allowlists, egress, install paths
        run: uv run --locked pytest -q tests/test_supply_chain.py
      - name: Each action's pin is the commit its tag points to, as recorded
        run: python3 tools/check_action_pins.py
      - name: Known vulnerabilities, in every locked version (not only this platform's)
        run: |
          uv run --locked python tools/locked_requirements.py > "$RUNNER_TEMP/locked.txt"
          uvx pip-audit@2.10.1 --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/locked.txt"
      - name: SBOM (CycloneDX) and the exported lock
        run: |
          mkdir -p sbom
          uv export --locked --all-extras --all-groups --no-emit-project --format requirements-txt -o sbom/requirements.txt
          uvx --from cyclonedx-bom@8.0.1 cyclonedx-py requirements sbom/requirements.txt --pyproject pyproject.toml --of JSON -o sbom/pointe.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom/
