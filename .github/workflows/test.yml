name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
      - run: uv run --locked pytest -q tests/test_orchestrator.py tests/test_units.py tests/test_http.py tests/test_security.py tests/test_remote.py tests/test_local.py
