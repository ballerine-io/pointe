# One grouped pull request a week per ecosystem. A bump that adds a package fails tests/test_supply_chain.py until a
# person adds it to docs/security/dependencies-allowlist.txt with a reason: that friction is the point.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/channel"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      channel:
        patterns: ["*"]
