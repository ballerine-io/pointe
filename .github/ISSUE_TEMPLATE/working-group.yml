name: Join the working group
description: Your team uses Pointe in real work and wants to join the Voice Coding Working Group.
title: "Working group: "
labels: [working-group]
body:
  - type: markdown
    attributes:
      value: |
        The Voice Coding Working Group is teams that use Pointe in real work. Members share what works
        and what breaks, help shape the practice, the roadmap and the benchmarks (Humanity's Last Keystroke), and
        contribute code or adapters when they can. Members get a voice in the roadmap, early builds, a shared channel
        with the maintainers, and their team's name on the page if they want it. There is no fee and no contract. This
        issue is public: write nothing here that you would not publish.
  - type: input
    id: team
    attributes:
      label: Team or company
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: How your team works with coding agents today
      description: Which agents, how many sessions at once, on which machines.
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you need from Pointe
  - type: input
    id: contact
    attributes:
      label: How to reach you
      description: A GitHub handle is enough.
