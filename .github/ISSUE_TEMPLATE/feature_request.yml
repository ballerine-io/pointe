name: Feature request
description: Something Pointe should do, once it has support in Discussions or is a small, clear change.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Is it on the roadmap already?** Check [ROADMAP.md](https://github.com/ballerine-io/pointe/blob/main/ROADMAP.md)
        and vote with a 👍 on its issue instead of opening a new one.

        **A new idea starts in [Discussions → Ideas](https://github.com/ballerine-io/pointe/discussions/categories/ideas)**,
        where others can upvote it. Ideas that gather support become roadmap issues. Use this form for a small, clear
        change, or for an idea a maintainer asked you to file.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it would work, on the page, in the app, or by voice.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy
      description: |
        Does this change what a spoken word can approve or send, or what leaves the Mac? Pointe's rule is that a
        feature may only narrow what voice can do, never widen it. See SECURITY.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you build it?
      options:
        - "Yes, with some guidance"
        - "I could test it"
        - "No"
