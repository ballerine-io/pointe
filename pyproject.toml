[project]
name = "pointe"
version = "1.0.1"
description = "Talk to your Claude Code sessions by voice"
authors = [
    { name = "Ballerine" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=2.6.0",
    "pipecat-ai[google,openai,silero,soniox,websocket]==1.15.0",
    "segno==1.6.6",
    "sherpa-onnx==2.0.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
local = [
    "pipecat-ai[kokoro]==1.15.0",
    "pipecat-ai[mlx-whisper]==1.15.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pipecat-ai[whisper]==1.15.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # Kokoro on the GPU (`mouth: local:kokoro-mlx`): first English audio in about 0.2 s, against 1.3 s on kokoro-onnx.
    "mlx-audio==0.6.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]==0.9.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # misaki loads this spaCy model and, when it is missing, pip-installs it at runtime: pinned here instead.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false  # scripts run from the checkout; nothing is installed as a package

[dependency-groups]
# A node (another machine whose sessions the hub voices, docs/design/multi-machine.md): `uv sync --locked --only-group
# node`. No Pipecat, model library or vendor SDK. websockets is the Codex adapter's app-server client.
node = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "loguru>=0.7.3",
    "uvicorn==0.54.0",
    "websockets>=17.4",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "sounddevice>=0.5.6",
]
