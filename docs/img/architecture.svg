<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="t d">
  <title id="t">Pointe's architecture</title>
  <desc id="d">Clients (the page, the Mac app, the iPhone app, a phone browser) hold one WebSocket per call to the daemon on the Mac. The daemon runs ears, echo guard, brain and mouth, with approvals, the checker and the reader, and calls model vendors or local models. Harness adapters connect it to Claude Code, OpenCode, Codex and, through a node, to sessions on other machines.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #14110F; }
    .sub { font-size: 11.5px; fill: #5C5550; }
    .h { font-size: 14px; font-weight: 600; }
    .lbl { font-size: 11.5px; fill: #5C5550; }
    .zone { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: #8A817A; }
    .box { fill: #FFFFFF; stroke: #CFC6BF; stroke-width: 1.2; }
    .hub { fill: #FFF6F0; stroke: #FF5A01; stroke-width: 1.4; }
    .inner { fill: #FFFFFF; stroke: #E3D9D2; stroke-width: 1; }
    .key { fill: #FFFFFF; stroke: #FF5A01; stroke-width: 1.2; }
    .line { stroke: #8A817A; stroke-width: 1.3; fill: none; }
    .flow { stroke: #FF5A01; stroke-width: 1.6; fill: none; }
    .dash { stroke: #8A817A; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .trust { stroke: #C0392B; stroke-width: 1.3; fill: none; stroke-dasharray: 2 4; }
    .tlbl { font-size: 11px; fill: #B03A2E; }
    .ah { fill: #8A817A; }
    .ahf { fill: #FF5A01; }
    @media (prefers-color-scheme: dark) {
      text { fill: #F7F2F0; }
      .sub, .lbl { fill: #B8AEA7; }
      .zone { fill: #93877F; }
      .box, .inner { fill: #1A1411; stroke: #4A403A; }
      .hub { fill: #241610; stroke: #FF7A33; }
      .key { fill: #1A1411; stroke: #FF7A33; }
      .line, .dash { stroke: #A0958D; }
      .ah { fill: #A0958D; }
      .flow { stroke: #FF7A33; }
      .ahf { fill: #FF7A33; }
      .trust { stroke: #F07167; }
      .tlbl { fill: #F4978E; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahf" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- Clients -->
  <text class="zone" x="20" y="20">CLIENTS</text>
  <rect class="box" x="20" y="30" width="215" height="58" rx="10"/>
  <text class="h" x="36" y="54">The page</text>
  <text class="sub" x="36" y="74">ui.html in Chrome, on this Mac</text>
  <rect class="box" x="255" y="30" width="215" height="58" rx="10"/>
  <text class="h" x="271" y="54">Mac app</text>
  <text class="sub" x="271" y="74">menu bar and window, PointeKit</text>
  <rect class="box" x="490" y="30" width="215" height="58" rx="10"/>
  <text class="h" x="506" y="54">iPhone app</text>
  <text class="sub" x="506" y="74">PointeKit screens, Face ID</text>
  <rect class="box" x="725" y="30" width="215" height="58" rx="10"/>
  <text class="h" x="741" y="54">Phone browser</text>
  <text class="sub" x="741" y="74">the page, paired by a link</text>

  <!-- Trust boundary: who may connect -->
  <path class="trust" d="M20,104 H470"/>
  <text class="tlbl" x="20" y="122">loopback 127.0.0.1:7860:</text>
  <text class="tlbl" x="20" y="137">a token or page cookie;</text>
  <text class="tlbl" x="20" y="152">Origin must match Host</text>
  <path class="trust" d="M490,104 H940"/>
  <text class="tlbl" x="490" y="122">phone listener :7443, TLS:</text>
  <text class="tlbl" x="490" y="137">the app pins the Mac's</text>
  <text class="tlbl" x="490" y="152">certificate; a key per phone</text>
  <text class="lbl" x="240" y="130">one WebSocket per call:</text>
  <text class="lbl" x="240" y="145">audio both ways, status, taps</text>

  <path class="flow" d="M215,88 V180" marker-end="url(#af)"/>
  <path class="flow" d="M450,88 V180" marker-end="url(#af)"/>
  <path class="flow" d="M685,88 V180" marker-end="url(#af)"/>
  <path class="flow" d="M920,88 V168 H686"/>

  <!-- The daemon -->
  <rect class="hub" x="20" y="182" width="680" height="318" rx="14"/>
  <text class="h" x="40" y="208">Daemon on your Mac (the hub)</text>
  <text class="sub" x="250" y="208">Python and Pipecat; state in ~/.claude-voice</text>

  <rect class="inner" x="40" y="226" width="130" height="56" rx="8"/>
  <text class="h" x="54" y="250">ears</text><text class="sub" x="54" y="268">speech to text</text>
  <rect class="inner" x="200" y="226" width="130" height="56" rx="8"/>
  <text class="h" x="214" y="250">echo guard</text><text class="sub" x="214" y="268">drops its own voice</text>
  <rect class="inner" x="360" y="226" width="150" height="56" rx="8"/>
  <text class="h" x="374" y="250">brain</text><text class="sub" x="374" y="268">decides, through tools</text>
  <rect class="inner" x="540" y="226" width="140" height="56" rx="8"/>
  <text class="h" x="554" y="250">mouth</text><text class="sub" x="554" y="268">text to speech</text>
  <path class="flow" d="M170,254 H198" marker-end="url(#af)"/>
  <path class="flow" d="M330,254 H358" marker-end="url(#af)"/>
  <path class="flow" d="M510,254 H538" marker-end="url(#af)"/>

  <rect class="inner" x="40" y="304" width="200" height="72" rx="8"/>
  <text class="h" x="54" y="328">approvals</text>
  <text class="sub" x="54" y="346">read-out from what will run,</text>
  <text class="sub" x="54" y="362">a bound yes, a tap, voice lock</text>
  <rect class="inner" x="260" y="304" width="200" height="72" rx="8"/>
  <text class="h" x="274" y="328">checker (gate)</text>
  <text class="sub" x="274" y="346">each send against what</text>
  <text class="sub" x="274" y="362">you just said</text>
  <rect class="inner" x="480" y="304" width="200" height="72" rx="8"/>
  <text class="h" x="494" y="328">reader</text>
  <text class="sub" x="494" y="346">session notes, reports,</text>
  <text class="sub" x="494" y="362">briefings, conflicts</text>
  <path class="line" d="M435,282 V302" marker-end="url(#a)"/>

  <rect class="inner" x="40" y="398" width="640" height="84" rx="8"/>
  <text class="h" x="54" y="422">sessions</text>
  <text class="sub" x="54" y="442">the joined sessions, which one is active, their transcripts and notes; the journal of each call</text>
  <text class="sub" x="54" y="460">routes for the page and the apps; the phone listener; the machines (nodes) paired with this hub</text>

  <!-- Vendors -->
  <text class="zone" x="725" y="200">MODELS</text>
  <rect class="box" x="725" y="210" width="215" height="132" rx="10"/>
  <text class="h" x="741" y="234">Model vendors</text>
  <text class="sub" x="741" y="254">Soniox, Anthropic, Gemini,</text>
  <text class="sub" x="741" y="270">OpenAI, ElevenLabs, with</text>
  <text class="sub" x="741" y="286">your keys; or local models</text>
  <text class="sub" x="741" y="302">on this Mac (Whisper,</text>
  <text class="sub" x="741" y="318">Kokoro, Gemma)</text>
  <path class="dash" d="M700,276 H723" marker-end="url(#a)"/>
  <rect class="key" x="725" y="362" width="215" height="56" rx="10"/>
  <text class="h" x="741" y="386">macOS Keychain</text>
  <text class="sub" x="741" y="404">pointe.&lt;vendor&gt;-api-key</text>
  <path class="dash" d="M723,390 H702" marker-end="url(#a)"/>
  <text class="tlbl" x="725" y="440">your keys reach only the daemon;</text>
  <text class="tlbl" x="725" y="455">what leaves goes to the vendors</text>
  <text class="tlbl" x="725" y="470">of your setup</text>

  <!-- Adapters -->
  <path class="flow" d="M360,500 V544" marker-end="url(#af)" marker-start="url(#af)"/>
  <text class="lbl" x="372" y="526">follow each transcript, send requests, hold permission prompts</text>
  <text class="zone" x="20" y="540">HARNESS ADAPTERS</text>
  <rect class="box" x="20" y="550" width="215" height="72" rx="10"/>
  <text class="h" x="36" y="574">Claude Code</text>
  <text class="sub" x="36" y="592">the plugin (/pointe:*) and its</text>
  <text class="sub" x="36" y="608">PermissionRequest hook</text>
  <rect class="box" x="255" y="550" width="215" height="72" rx="10"/>
  <text class="h" x="271" y="574">OpenCode</text>
  <text class="sub" x="271" y="592">its local service's API</text>
  <rect class="box" x="490" y="550" width="215" height="72" rx="10"/>
  <text class="h" x="506" y="574">Codex CLI</text>
  <text class="sub" x="506" y="592">codex --remote unix://</text>
  <rect class="box" x="725" y="550" width="215" height="72" rx="10"/>
  <text class="h" x="741" y="574">Remote</text>
  <text class="sub" x="741" y="592">a session on another</text>
  <text class="sub" x="741" y="608">machine, through its node</text>

  <!-- Node -->
  <path class="trust" d="M490,660 H940"/>
  <text class="tlbl" x="490" y="652">pinned TLS link, HMAC-authenticated, to :7443</text>
  <path class="line" d="M832,622 V694" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect class="box" x="490" y="696" width="450" height="80" rx="10"/>
  <text class="h" x="506" y="720">Node on another Mac or a Linux host</text>
  <text class="sub" x="506" y="740">the same adapters run there; no audio, no keys; it ships masked</text>
  <text class="sub" x="506" y="756">transcripts, types your requests in, and re-checks each approval</text>
  <text class="sub" x="20" y="720">Session output is data, not instructions:</text>
  <text class="sub" x="20" y="738">the checker tests each send, and approvals</text>
  <text class="sub" x="20" y="756">follow rules in code (guards.py, readout.py).</text>
</svg>
