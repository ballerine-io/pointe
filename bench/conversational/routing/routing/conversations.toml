# Session Routing: 12 conversations x 5 turns, spoken to four live Claude Code sessions.
# Text: CC BY 4.0, written for this suite; every name is invented. Audio is rendered from it by Kokoro-82M (Apache-2.0).
# Each turn asks for a one-line edit that carries a unique word, so the file system shows where the request went.
# `ref` is resolved against [sessions] by check.resolve(); `target` must equal that resolution (tested offline).
# Ambiguous turns resolve to two sessions by construction; `intended` is the one the scripted user names when asked.
canary = "e93be0a4-7858-4b2c-9093-72b70a7b6830"
version = "routing-0.1"

[sessions.tariff]
product = "tariff"
role = "backend"

[sessions.tariff-web]
product = "tariff"
role = "web"

[sessions.depot]
product = "depot"
role = "backend"

[sessions.depot-docs]
product = "depot"
role = "docs"

# ---- c01
[[conversation]]
id = "c01"
voice = "af_heart"
[[conversation.turn]]
type = "name"
ref = { name = "tariff-web" }
target = ["tariff-web"]
word = "candle"
say = "In tariff web, add a line with the word candle to the notes file."
[[conversation.turn]]
type = "context"
ref = { context = "same" }
target = ["tariff-web"]
word = "river"
say = "Same one again: add a line with the word river to the notes file."
[[conversation.turn]]
type = "ambiguous"
ref = { role = "backend" }
target = ["tariff", "depot"]
intended = "tariff"
word = "pencil"
say = "Add a line with the word pencil to the notes file in the backend."
[[conversation.turn]]
type = "description"
ref = { role = "docs" }
target = ["depot-docs"]
word = "garden"
say = "Over in the docs, add a line with the word garden to the notes file."
[[conversation.turn]]
type = "two"
ref = { names = ["tariff", "depot-docs"] }
target = ["tariff", "depot-docs"]
word = "ladder"
say = "Add a line with the word ladder to the notes file in both tariff and depot docs."

