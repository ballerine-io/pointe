# Spoken Identifiers: items. Text CC BY 4.0, code MIT, every name invented.
# canary 01bb309a-90d0-46f8-9fbe-101a30a04b1f
#
# A symbol is one line of the fixture (its anchor): the definition, the assignment or the add_argument line.
# `qual` is what a person says to tell two same-named symbols apart (the file or the class); it is part of the
# spoken form that the decoy distance is measured on.
# A target's instruction is always the same tiny action: a comment line that says "marked" directly above the symbol.

version = "identifiers-v1"
