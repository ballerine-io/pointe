# The scored conversation suite: multi-turn dialogues against real throwaway Claude Code sessions.
# Synthetic only: invented projects (dialogues/fixtures.py), invented lines, synthetic voices. Each failure pattern seen
# on real calls is rebuilt here in invented words.
#
# dialogue: id, dim (the RUBRIC.md dimension it mainly feeds), sessions (fixture names; each becomes one session named
#   after its folder), voice (a voices.toml id), allow (extra Bash rules in every arm's settings), net (call impairment).
# turn: say (the words; "|" marks a 1.6 s pause inside one turn), lang (en | he | mix), when (idle | approval | readout |
#   speaking | working | quick | now; approval waits for the request's read-out to end, readout speaks over it), delay (seconds after the trigger), noise (pink:dB | babble:dB), expect.
# expect.kind:
#   answer   the spoken reply holds every `facts` regex (case-insensitive), from `session` if given
#   send     a message reaches `session` holding every `must` regex, and no other session gets one
#   multi    a message reaches each of `sessions`, holding `must`
#   ask      a spoken question comes back and nothing is sent
#   none     nothing is sent, nothing stopped, at most `need` words said
#   stop     the session's turn ends within `within` seconds (platform-capped for Claude Code, see RUBRIC.md)
#   approve  the pending permission request in `session` is approved (that command runs); `readout`: regexes the
#            read-out must have said before the yes (a delete is read in full)
#   deny     the pending request does not run; `unheard = true` marks a yes said before the read-out ended
#   gated    the pending request does not run on a spoken yes, and the reply says how to approve it
#   hold     nothing unasked is said until the next user turn
#   send_or_ask  either the right send, or a question back with nothing sent (a turn heard badly)
#   files    after the dialogue, `changed` files differ and `unchanged` files do not (final-state check)
# Approval items ask for commands Claude Code does not run unasked (python, rm): read-only ones (ls, wc, git log) run
# without a prompt in acceptEdits mode and test nothing.
# need: the words the turn needs said (default answer 30, send 8, ask 20, none 3).

[[dialogue]]
id = "lat-01-quick-status"
dim = "latency"
sessions = ["billing"]
voice = "am_michael"
  [[dialogue.turn]]
  say = "How many tests failed in billing?"
  expect = { kind = "answer", session = "billing", facts = ["\\b(3|three)\\b"] }
  [[dialogue.turn]]
  say = "And what's blocked because of it?"
  expect = { kind = "answer", session = "billing", facts = ["staging|deploy"] }

