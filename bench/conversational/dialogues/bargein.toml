# Barge-in and backchannel set: 30 interruptions and 30 backchannels over a long answer, in SYNTHETIC voices (Kokoro).
# Not recorded people: no openly licensed corpus holds these lines spoken over an assistant (HUMAN_SET.md). Built for
# the independent review's item 5 (interruption that feels instant). Each dialogue asks a question whose answer runs
# several sentences, then speaks over it while it plays: an interruption that asks something new (the voice must stop
# and answer it), or a listener's sound (the voice must go on). Score with bargein_report.py.

[[dialogue]]
id = "bi-int-01"
dim = "turn-taking"
sessions = ["billing"]
voice = "af_heart"
  [[dialogue.turn]]
  say = "Explain how a hash map handles collisions, in a few sentences."
  expect = { kind = "answer", need = 60 }
  [[dialogue.turn]]
  say = "Wait, stop. What's the capital of Japan?"
  when = "speaking"
  delay = 2.69
  expect = { kind = "answer", facts = ['tokyo'] }

